plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.1'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.fiiiiive'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}


repositories {
	maven { url 'https://jitpack.io' }
	mavenCentral()
}

dependencies {
	// boot
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// jpa
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	// redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	
	// redisson - 분산 락 (Distributed Lock with Pub/Sub)
	implementation 'org.redisson:redisson-spring-boot-starter:3.27.2'

	// S3
	implementation group: 'io.awspring.cloud', name: 'spring-cloud-starter-aws', version: '2.4.2'

	// security + oauth
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'com.google.code.gson:gson'
	implementation 'org.springframework.security:spring-security-oauth2-client'

	// jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// socket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// mail
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// swagger-ui
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// lombok
	compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
	annotationProcessor('org.projectlombok:lombok')

	// iamport
	implementation 'com.github.iamport:iamport-rest-client-java:0.2.23'

	// validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// promethues
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

// Dockerfiles use the repository root as their build context.
def dockerPlatform = project.findProperty('platform') ?: 'frontend'
def composeFile = '../meta/infra/docker-compose.yml'

tasks.register('buildFrontend', Exec) {
    workingDir '../frontend'
    commandLine (System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'), 'run', 'build'
}

tasks.register('buildDockerBackend', Exec) {
    commandLine 'docker', 'compose', '-f', composeFile, 'build', 'backend'
}

tasks.register('buildDockerFrontend', Exec) {
    commandLine 'docker', 'compose', '-f', composeFile, 'build', 'frontend'
}

tasks.register('docker') {
    dependsOn dockerPlatform == 'backend' ? 'buildDockerBackend' : 'buildDockerFrontend'
}

tasks.register('dockerComposeUpBackend', Exec) {
    dependsOn 'buildDockerBackend'
    commandLine 'docker', 'compose', '-f', composeFile, 'up', '-d', 'backend'
}

tasks.register('dockerComposeUpFrontend', Exec) {
    dependsOn 'buildDockerFrontend'
    commandLine 'docker', 'compose', '-f', composeFile, 'up', '-d', 'frontend'
}
