services:
  backend:
    container_name: zippop-backend
    build:
      context: ..
      dockerfile: cicd/Dockerfile_backend
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      SERVER_ADDR: 0.0.0.0
      DB_URL: jdbc:mariadb://mariadb:3306/${MARIADB_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      REDIS_URL: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-qwer1234}
      NAVER_CLIENT_SECRET: ${NAVER_CILENT_SECRET:-local-secret}
      FILE_UPLOAD_TYPE: local
      LOCAL_UPLOAD_PATH: /app/uploads
      S3_REGION: ap-northeast-2
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger-ui/index.html"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  frontend:
    container_name: zippop-frontend
    build:
      context: ..
      dockerfile: cicd/Dockerfile_frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

  mariadb:
    container_name: zippop-mariadb
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/mariadb.cnf:/etc/mysql/conf.d/zippop.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: zippop-redis
    image: redis:7.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-qwer1234}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-qwer1234}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mariadb_data:
  redis_data:
  uploads:
